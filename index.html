<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHP Server</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
  }
  main { max-width: 40rem; padding: 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  .ok { color: #4ade80; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; margin: 1.5rem 0 0; }
  dt { color: #9aa0aa; }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  code { background: #1c1f26; padding: .1rem .3rem; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1><span class="ok">●</span> 静态页面已就绪</h1>
  <p>这个文件就是 php 内置服务器的目录索引页（<code>index.html</code>）。</p>
  <dl>
    <dt>服务器</dt><dd>php -S 0.0.0.0:$PORT</dd>
    <dt>根目录</dt><dd>/app</dd>
    <dt>时间</dt><dd id="now">-</dd>
  </dl>
</main>
<script>
  document.getElementById('now').textContent = new Date().toLocaleString();
</script>
</body>
</html>
